<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para ti ❤️</title>
<meta property="og:image" content="https://jvillota933.github.io/vivina/foto.jpg">
<meta property="og:title" content="Un recuerdo para ti ❤️">
<meta property="og:description" content="Una foto, una nota y una canción 📸">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--papel:#fdf3e3;--tinta:#5a3a3a;--rojo:#e0485f}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;padding:26px 16px 46px;overflow-x:hidden;text-align:center;
  font-family:'Quicksand','Segoe UI',sans-serif;color:#f6e9ee;
  background:radial-gradient(ellipse at top,#4a1942 0%,#2a1038 45%,#1a0b24 100%) fixed}
.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;pointer-events:none;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.fl{position:fixed;bottom:-30px;pointer-events:none;z-index:1;animation:sube linear forwards}
@keyframes sube{to{transform:translateY(-115vh) rotate(-20deg);opacity:0}}

#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(ellipse at center,#4a1942,#1a0b24);padding:24px;cursor:pointer;transition:opacity .7s,visibility .7s}
#intro.off{opacity:0;visibility:hidden}
#intro .cam{font-size:90px;animation:bote 1.6s infinite}
#intro h2{font-family:'Caveat',cursive,Georgia,serif;font-size:38px;color:#f5d28a}
#intro p{font-size:15px}
@keyframes bote{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.08)}}

main{position:relative;z-index:2;width:100%;max-width:400px;margin:auto;align-self:flex-start;visibility:hidden}
main.on{visibility:visible}
.polaroid{position:relative;background:#fff;padding:14px 14px 16px;border-radius:4px;transform:rotate(-3deg);
  box-shadow:0 14px 30px rgba(0,0,0,.5);margin:14px auto 30px;width:280px}
main.on .polaroid{animation:cae 1s cubic-bezier(.2,1.3,.4,1)}
@keyframes cae{from{opacity:0;transform:translateY(-60px) rotate(8deg)}}
.polaroid::before{content:'';position:absolute;top:-14px;left:50%;width:90px;height:26px;transform:translateX(-50%) rotate(3deg);
  background:rgba(255,214,120,.75);box-shadow:0 2px 4px rgba(0,0,0,.12)}
.polaroid img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 40%;display:block;background:#eee}
.polaroid .pie{font-family:'Caveat',cursive,Georgia,serif;font-size:27px;margin-top:8px;color:var(--tinta)}

.nota{position:relative;background:var(--papel);border-radius:6px;padding:22px 20px 20px;text-align:left;transform:rotate(1.2deg);
  color:var(--tinta);box-shadow:0 10px 24px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(224,72,95,.18) 31px 32px)}
.nota h1{font-family:'Caveat',cursive,Georgia,serif;font-size:36px;color:var(--rojo);line-height:1.2;margin-bottom:4px}
#carta{font-family:'Caveat',cursive,Georgia,serif;font-size:23px;line-height:32px;white-space:pre-line;min-height:190px}
#carta::after{content:'|';color:var(--rojo);animation:par 1s infinite}
#carta.fin::after{content:''}
@keyframes par{50%{opacity:0}}
.firma{font-family:'Caveat',cursive,Georgia,serif;font-size:28px;text-align:right;color:var(--rojo);margin-top:8px}

#contador{display:none;margin:22px 0 0}
#contador small{display:block;font-size:13px;margin-bottom:8px}
.cajas{display:flex;gap:10px;justify-content:center}
.caja{color:var(--tinta);background:#fff;border-radius:12px;padding:8px 14px;min-width:70px;box-shadow:0 4px 10px rgba(90,58,58,.15)}
.caja b{display:block;font-size:24px;color:var(--rojo)}
.caja span{font-size:12px}

.disco{margin:28px 0 0}
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;cursor:pointer;
  border:6px solid #fff;box-shadow:0 10px 24px rgba(90,58,58,.3);transform:rotate(-1deg)}
.vid img{width:100%;height:100%;object-fit:cover;opacity:.85;display:block}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;
  background:var(--rojo);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;padding-left:4px;
  box-shadow:0 4px 14px rgba(0,0,0,.4);animation:bote 1.8s infinite}
.cancion{font-family:'Caveat',cursive,Georgia,serif;font-size:23px;margin:12px 0 10px}
.btn{display:inline-block;padding:10px 24px;border-radius:30px;background:var(--rojo);color:#fff;text-decoration:none;
  font-weight:600;font-size:14px;box-shadow:0 5px 14px rgba(224,72,95,.4)}
.final{margin-top:22px;font-family:'Caveat',cursive,Georgia,serif;font-size:32px;color:#ff7a9c}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="intro">
  <div class="cam">📸</div>
  <h2 id="t-intro"></h2>
  <p>Toca para ver el recuerdo</p>
</div>

<main id="card">
  <div class="polaroid">
    <img id="foto" alt="Foto de nosotros" src="foto.jpg">
    <div class="pie" id="t-pie"></div>
  </div>
  <div class="nota">
    <h1 id="t-para"></h1>
    <p id="carta"></p>
    <div class="firma" id="t-firma"></div>
  </div>
  <div id="contador"><small>Llevamos juntos</small><div class="cajas"></div></div>
  <div class="disco">
    <div class="vid" id="player" role="button" aria-label="Reproducir canción">
      <img id="thumb" alt="Canción">
      <div class="play">▶</div>
    </div>
    <p class="cancion">🎵 Esta canción es para ti</p>
    <a class="btn" id="yt" href="#">Abrir en YouTube</a>
  </div>
  <div class="final" id="t-final"></div>
</main>

<!-- ============ CONFIGURACIÓN: aquí haces tus cambios ============ -->
<script>
const NOMBRE_ELLA   = "Viviana";
const NOMBRE_EL     = "Javier";
const FOTO          = "foto.jpg";      // nombre de la foto subida al repositorio
const VIDEO_ID      = "vp707-IaSRs";   // código del video de YouTube (lo que va después de v=)
const FECHA_INICIO  = "";              // ejemplo: "2024-02-14". Vacío = no muestra el contador
const FRASE_INTRO   = "tengo un recuerdo para ti";
const PIE_FOTO      = "Tú y yo ❤️";    // texto escrito bajo la foto
const FRASE_FINAL   = "Te amo ❤️";
const MENSAJE = `Viviana, eres mi felicidad de todos los días. Gracias por tu hermosa sonrisa, tus abrazos y por estar a mi lado en cada momento.

Te dedico "Eres" de Grupo Niche porque describe perfectamente todo lo que significas para mí... ❤️`;
</script>
<!-- ================= FIN DE LA CONFIGURACIÓN ================= -->

<script>
document.title = "Para " + NOMBRE_ELLA + " ❤️";
document.getElementById('t-intro').textContent = NOMBRE_ELLA + ", " + FRASE_INTRO;
document.getElementById('t-para').textContent = "Para " + NOMBRE_ELLA + ",";
document.getElementById('t-pie').textContent = PIE_FOTO;
document.getElementById('t-firma').textContent = "— " + NOMBRE_EL;
document.getElementById('t-final').textContent = FRASE_FINAL;
document.getElementById('foto').src = FOTO;
document.getElementById('thumb').src = "https://i.ytimg.com/vi/" + VIDEO_ID + "/hqdefault.jpg";
document.getElementById('yt').href = "https://youtu.be/" + VIDEO_ID;

for(let i=0;i<45;i++){
  const st = document.createElement('div'); st.className = 'star';
  st.style.left = Math.random()*100 + 'vw'; st.style.top = Math.random()*100 + 'vh';
  st.style.animationDelay = Math.random()*3 + 's'; document.body.appendChild(st);
}
function subir(){
  if(document.hidden || document.querySelectorAll('.fl').length > 16) return;
  const e = document.createElement('div'); e.className = 'fl';
  e.textContent = ['❤️','💖','🌷','✨','💌'][Math.floor(Math.random()*5)];
  e.style.left = Math.random()*100 + 'vw';
  e.style.fontSize = (14 + Math.random()*16) + 'px';
  e.style.animationDuration = (7 + Math.random()*5) + 's';
  document.body.appendChild(e);
  setTimeout(() => e.remove(), 12500);
}
function escribir(){
  const el = document.getElementById('carta'); let i = 0;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ el.textContent = MENSAJE; el.classList.add('fin'); return; }
  (function paso(){
    el.textContent = MENSAJE.slice(0, ++i);
    if(i < MENSAJE.length) setTimeout(paso, 40); else el.classList.add('fin');
  })();
}
function contador(){
  const s = new Date(FECHA_INICIO + 'T00:00:00'); if(!FECHA_INICIO || isNaN(s)) return;
  const n = new Date(); let a = n.getFullYear()-s.getFullYear(), m = n.getMonth()-s.getMonth(), d = n.getDate()-s.getDate();
  if(d < 0){ m--; d += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
  if(m < 0){ a--; m += 12; } if(a < 0) return;
  const c = (v,t) => '<div class="caja"><b>'+v+'</b><span>'+t+'</span></div>';
  const b = document.getElementById('contador');
  b.querySelector('.cajas').innerHTML = c(a, a==1?'año':'años') + c(m, m==1?'mes':'meses') + c(d, d==1?'día':'días');
  b.style.display = 'block';
}
document.getElementById('intro').addEventListener('click', function(){
  this.classList.add('off');
  document.getElementById('card').classList.add('on');
  setInterval(subir, 650); contador(); setTimeout(escribir, 900);
});
// El video se carga al tocar (funciona mejor en celulares y en el navegador de WhatsApp)
document.getElementById('player').addEventListener('click', function(){
  this.innerHTML = '<iframe src="https://www.youtube.com/embed/' + VIDEO_ID + '?autoplay=1&rel=0&playsinline=1" title="Canción" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
  this.style.cursor = 'default';
}, {once:true});
</script>
</body>
</html>
