<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Viviana ❤️</title>
<meta property="og:title" content="Para Viviana ❤️">
<meta property="og:description" content="Una carta y una canción, solo para ti 🌙">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--oro:#f5d28a;--rosa:#ff7a9c;--noche:#1a0b24}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;padding:24px 16px 44px;overflow-x:hidden;text-align:center;
  font-family:'Playfair Display',Georgia,serif;color:#f6e9ee;
  background:radial-gradient(ellipse at top,#4a1942 0%,#2a1038 45%,var(--noche) 100%) fixed}
.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;pointer-events:none;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.up{position:fixed;bottom:-30px;pointer-events:none;z-index:1;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}

#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:radial-gradient(ellipse at center,#4a1942,var(--noche));transition:opacity .8s,visibility .8s;cursor:pointer;padding:24px}
#intro.off{opacity:0;visibility:hidden}
#intro .corazon{font-size:100px;filter:drop-shadow(0 0 22px var(--rosa));animation:lat 1.4s infinite}
#intro h2{font-family:'Dancing Script',cursive,Georgia,serif;font-size:34px;color:var(--oro)}
#intro p{font-style:italic;font-size:15px;opacity:.85}
@keyframes lat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

.card{position:relative;z-index:2;width:100%;max-width:400px;margin:auto;align-self:flex-start;visibility:hidden;
  padding:30px 22px 28px;border-radius:26px;background:rgba(255,255,255,.06);backdrop-filter:blur(8px);
  border:1px solid rgba(245,210,138,.45);box-shadow:0 0 40px rgba(255,122,156,.25)}
.card.on{visibility:visible;animation:ent 1s ease}
@keyframes ent{from{opacity:0;transform:translateY(20px)}}

.arco{width:230px;height:280px;margin:0 auto 20px;padding:5px;border-radius:115px 115px 18px 18px;
  background:linear-gradient(160deg,var(--oro),#c98b4f,var(--oro));box-shadow:0 0 28px rgba(245,210,138,.4)}
.arco img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;border-radius:110px 110px 14px 14px;display:block}

h1{font-family:'Dancing Script',cursive,Georgia,serif;font-size:44px;color:var(--oro);line-height:1.1}
.firma{font-size:13px;letter-spacing:3px;opacity:.8;margin:6px 0 18px}
.sep{color:var(--oro);letter-spacing:8px;margin-bottom:16px}
#carta{white-space:pre-line;font-style:italic;font-size:16.5px;line-height:1.85;min-height:190px;margin-bottom:18px;text-align:left}
#carta::after{content:'▍';color:var(--oro);animation:par 1s infinite}
#carta.fin::after{content:''}
@keyframes par{50%{opacity:0}}

#contador{display:none;margin-bottom:20px}
#contador small{display:block;font-size:13px;opacity:.8;margin-bottom:8px}
.cajas{display:flex;gap:10px;justify-content:center}
.caja{border:1px solid rgba(245,210,138,.5);border-radius:14px;padding:8px 14px;min-width:70px}
.caja b{display:block;font-size:24px;color:var(--oro)}
.caja span{font-size:12px;opacity:.85}

.vid{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;cursor:pointer;
  border:1px solid rgba(245,210,138,.5);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.vid img{width:100%;height:100%;object-fit:cover;opacity:.8;display:block}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;
  background:var(--rosa);color:#fff;font-size:25px;display:flex;align-items:center;justify-content:center;padding-left:4px;
  box-shadow:0 0 22px var(--rosa);animation:lat 1.8s infinite}
.nota{font-size:13px;font-style:italic;opacity:.85;margin:10px 0 12px}
.btn{display:inline-block;padding:11px 26px;border-radius:30px;border:1px solid var(--oro);color:var(--oro);
  text-decoration:none;font-size:14px}
.final{margin-top:22px;font-family:'Dancing Script',cursive,Georgia,serif;font-size:28px;color:var(--rosa)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="intro">
  <div class="corazon">❤️</div>

<script>
// Fecha en que empezaron (AAAA-MM-DD). Si la dejas vacía, el contador no se muestra.
const FECHA_INICIO = "";

const TEXTO = "Viviana, eres mi felicidad de todos los días. Gracias por tu hermosa sonrisa, tus abrazos y por estar a mi lado en cada momento.\n\nTe dedico \"Eres\" de Grupo Niche porque describe perfectamente todo lo que significas para mí... ❤️";

for(let i=0;i<45;i++){
  const s=document.createElement('div'); s.className='star';
  s.style.left=Math.random()*100+'vw'; s.style.top=Math.random()*100+'vh';
  s.style.animationDelay=Math.random()*3+'s'; document.body.appendChild(s);
}
function subir(){
  if(document.hidden || document.querySelectorAll('.up').length>16) return;
  const e=document.createElement('div'); e.className='up';
  e.textContent=['💖','✨','💗','🌹'][Math.floor(Math.random()*4)];
  e.style.left=Math.random()*100+'vw'; e.style.fontSize=(14+Math.random()*16)+'px';
  e.style.animationDuration=(7+Math.random()*5)+'s'; document.body.appendChild(e);
  setTimeout(()=>e.remove(),12500);
}
function escribir(){
  const el=document.getElementById('carta'); let i=0;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ el.textContent=TEXTO; el.classList.add('fin'); return; }
  (function paso(){
    el.textContent=TEXTO.slice(0,++i);
    if(i<TEXTO.length) setTimeout(paso, 38); else el.classList.add('fin');
  })();
}
function contador(){
  const s=new Date(FECHA_INICIO+'T00:00:00'); if(!FECHA_INICIO||isNaN(s)) return;
  const n=new Date(); let a=n.getFullYear()-s.getFullYear(), m=n.getMonth()-s.getMonth(), d=n.getDate()-s.getDate();
  if(d<0){m--; d+=new Date(n.getFullYear(),n.getMonth(),0).getDate();}
  if(m<0){a--; m+=12;} if(a<0) return;
  const c=(v,t)=>'<div class="caja"><b>'+v+'</b><span>'+t+'</span></div>';
  const b=document.getElementById('contador');
  b.querySelector('.cajas').innerHTML=c(a,a==1?'año':'años')+c(m,m==1?'mes':'meses')+c(d,d==1?'día':'días');
  b.style.display='block';
}
document.getElementById('intro').addEventListener('click',function(){
  this.classList.add('off');
  document.getElementById('card').classList.add('on');
  setInterval(subir,600); contador(); setTimeout(escribir,700);
});
// El video se carga al tocar (funciona mejor en celulares y en el navegador de WhatsApp)
document.getElementById('player').addEventListener('click',function(){
  this.innerHTML='<iframe src="https://www.youtube.com/embed/vp707-IaSRs?autoplay=1&rel=0&playsinline=1" title="Grupo Niche - Eres" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
  this.style.cursor='default';
},{once:true});
</script>
